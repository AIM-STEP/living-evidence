<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-label="EvidenceBank：跃起的存钱罐小猪，背上投币口上方一枚翻滚的菱形，肚子上是迷你森林图，卷尾是手绘美元符号">
  <!-- $ 卷尾（手绘 S + 竖线） -->
  <g transform="translate(95.5 62) rotate(32)">
    <path d="M 3.8 -5.5 Q -0.5 -8.5 -3.2 -5.2 Q -5.2 -2.4 -1.8 -0.8 Q 2 1 3.2 3.2 Q 5 6.4 1 8 Q -2.5 9.3 -4.5 6.5"
          fill="none" stroke="#3E7BEA" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="0" y1="-8.8" x2="0" y2="10" stroke="#3E7BEA" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- 奔跑四肢：前腿前伸、后腿后蹬 -->
  <rect x="42" y="89" width="9" height="8" rx="4" fill="#3E7BEA" transform="rotate(-32 46.5 90)"/>
  <rect x="70" y="89" width="9" height="8" rx="4" fill="#3E7BEA" transform="rotate(26 74.5 90)"/>
  <!-- 身体与鼻子 -->
  <ellipse cx="60" cy="68" rx="33" ry="25" fill="#3E7BEA"/>
  <!-- 微微抬起的头部：鼻子、鼻孔和眼睛一起向上转 -->
  <g transform="rotate(12 50 70)">
    <ellipse cx="27" cy="68" rx="8" ry="7" fill="#3E7BEA"/>
    <circle cx="24.5" cy="65.5" r="1.3" fill="#FFFFFF"/>
    <circle cx="24.5" cy="70.5" r="1.3" fill="#FFFFFF"/>
    <circle cx="40.5" cy="58.5" r="2.7" fill="#FFFFFF"/>
  </g>
  <!-- 正落向投币口的菱形（与森林图小钻同尺寸） -->
  <polygon points="58,40 62,37.5 66,40 62,42.5" fill="#3E7BEA" transform="rotate(-14 62 40)"/>
  <!-- 背上的横向投币口 -->
  <rect x="55" y="43.6" width="14" height="3.4" rx="1.7" fill="#FFFFFF"/>
  <!-- 肚子上的迷你森林图：基准线 + 两行区间 + 底部合并大钻 -->
  <line x1="52" y1="56" x2="52" y2="84" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="46" y1="63" x2="70" y2="63" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="55,63 59,60.5 63,63 59,65.5" fill="#FFFFFF"/>
  <line x1="48" y1="73" x2="76" y2="73" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="62,73 66,70.5 70,73 66,75.5" fill="#FFFFFF"/>
  <polygon points="54,82 62,78 70,82 62,86" fill="#FFFFFF"/>
</svg>
