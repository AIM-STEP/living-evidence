<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 18 100 100" role="img"
     aria-label="EvidenceBank：尖耳朵、鼻口上有白色美元符号的存钱罐小猪，背上菱形落向投币口，肚子是森林图，卷尾是美元符号">
  <!-- $ 卷尾（手绘 S + 竖线） -->
  <g transform="translate(95.5 62) rotate(32)">
    <path d="M 3.8 -5.5 Q -0.5 -8.5 -3.2 -5.2 Q -5.2 -2.4 -1.8 -0.8 Q 2 1 3.2 3.2 Q 5 6.4 1 8 Q -2.5 9.3 -4.5 6.5"
          fill="none" stroke="#3E7BEA" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="0" y1="-8.8" x2="0" y2="10" stroke="#3E7BEA" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- 短腿在圆润身体下方清楚露出 -->
  <rect x="41" y="88" width="9" height="14" rx="3" fill="#3E7BEA" transform="rotate(-10 45.5 95)"/>
  <rect x="77" y="88" width="9" height="14" rx="3" fill="#3E7BEA" transform="rotate(10 81.5 95)"/>
  <!-- 圆润的存钱罐身体 -->
  <ellipse cx="62" cy="70" rx="35" ry="25" fill="#3E7BEA"/>
  <!-- 前后两只耳朵、突出鼻口和眼睛 -->
  <path d="M43 49 Q44 42 48 39 Q49 38 51 40 L56 47 Q52 50 43 49Z" fill="#3E7BEA"/>
  <path d="M34 51 Q32 42 34 36 Q35 33 38 36 L47 46 Q42 50 34 51Z" fill="#3E7BEA"/>
  <path d="M36 42 L37 38 L43 45 Q39 44 36 47Z" fill="#A8C8FF"/>
  <rect x="17" y="54" width="20" height="14" rx="6" fill="#3E7BEA"/>
  <circle cx="21" cy="58" r="1.4" fill="#FFFFFF"/>
  <circle cx="21" cy="64" r="1.4" fill="#FFFFFF"/>
  <!-- 鼻口上的白色手绘美元符号 -->
  <g transform="translate(29 61) scale(.55)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M3.8 -5.5 Q-.5 -8.5 -3.2 -5.2 Q-5.2 -2.4 -1.8 -.8 Q2 1 3.2 3.2 Q5 6.4 1 8 Q-2.5 9.3 -4.5 6.5" stroke-width="3.6"/>
    <line x1="0" y1="-8.8" x2="0" y2="10" stroke-width="3"/>
  </g>
  <circle cx="43" cy="57" r="2.7" fill="#FFFFFF"/>
  <!-- 正落向投币口的菱形（与森林图小钻同尺寸） -->
  <polygon points="60,39 64,36.5 68,39 64,41.5" fill="#3E7BEA" transform="rotate(-14 64 39)"/>
  <!-- 背上的横向投币口 -->
  <rect x="57" y="47" width="14" height="3.4" rx="1.7" fill="#FFFFFF"/>
  <!-- 肚子上的迷你森林图：基准线 + 两行区间 + 底部合并大钻 -->
  <line x1="52" y1="56" x2="52" y2="84" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="46" y1="63" x2="70" y2="63" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="55,63 59,60.5 63,63 59,65.5" fill="#FFFFFF"/>
  <line x1="48" y1="73" x2="76" y2="73" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="62,73 66,70.5 70,73 66,75.5" fill="#FFFFFF"/>
  <polygon points="54,82 62,78 70,82 62,86" fill="#FFFFFF"/>
</svg>
