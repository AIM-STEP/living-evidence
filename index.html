function referenceText(p){

 const volume=(p.volume?';'+p.volume:'')+(p.issue?'('+p.issue+')':'')+(p.pages?':'+p.pages:'');

}
function bibtex(p){
 function clean(value){return String(value||'').replace(/\\/g,'\\textbackslash{}').replace(/[{}]/g,'').replace(/%/g,'\\%').replace(/&/g,'\\&').replace(/_/g,'\\_').replace(/#/g,'\\#').replace(/\$/g,'\\$')}
 const fields={title:p.title,author:p.authors?String(p.authors).split(';').map(function(a){return a.trim()}).filter(Boolean).join(' and '):'',journal:p.journal,year:p.year,volume:p.volume,number:p.issue,pages:p.pages,doi:p.doi,url:p.url||(p.doi?'https://doi.org/'+p.doi:'')};
 return '@'+(p.citationType||'article')+'{Liu'+p.year+'_'+String(p.id).replace(/[^a-z0-9]/gi,'' )+',\n'+Object.keys(fields).filter(function(k){return fields[k]}).map(function(k){return '  '+k+' = {'+clean(fields[k])+'}'}).join(',\n')+'\n}\n';
}
async function copyText(textValue,success,fallback){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(textValue)}else{const input=document.createElement('textarea');input.value=textValue;input.style.position='fixed';input.style.opacity='0';document.getElementById('paper-content').append(input);input.select();const ok=document.execCommand('copy');input.remove();if(!ok)throw new Error('Copy unavailable')}showToast(success)}catch(e){const input=document.getElementById('citation-text');if(input){input.focus();input.select()}showToast(fallback)}
}
function openPaper(id){
 const p=DATA.publications.find(function(p){return p.id===id});if(!p)return;
 const box=document.getElementById('paper-dialog');
 const publication=[p.journal,p.year,p.volume?(p.volume+(p.issue?'('+p.issue+')':'')):'',p.pages].filter(Boolean).join(' · ');
 document.getElementById('paper-content').innerHTML='<div class="paper-dialog-top"><p class="eyebrow">'+t('paperKicker')+'</p><button class="icon-button" id="close-paper" aria-label="'+t('closePaper')+'" autofocus>×</button></div><div class="pub-meta"><span class="journal">'+esc(p.journal)+'</span><span class="type-pill">'+esc(typeLabels[lang][p.type]||p.type)+'</span><span>'+esc(p.year)+'</span></div><h2 id="paper-heading">'+esc(p.title)+'</h2>'+(p.authors?'<p class="paper-authors" aria-label="'+t('authors')+'">'+esc(p.authors)+'</p>':'')+(local(p.summary)?'<p class="paper-summary-text">'+esc(local(p.summary))+'</p>':'')+'<dl class="paper-facts"><div><dt>'+t('topic')+'</dt><dd>'+esc(categoryLabels[lang][p.category]||p.category)+'</dd></div><div><dt>'+t('published')+'</dt><dd>'+esc(publication)+'</dd></div>'+(p.doi?'<div class="wide"><dt>DOI</dt><dd><a href="https://doi.org/'+esc(encodeURI(p.doi))+'" target="_blank" rel="noopener noreferrer">'+esc(p.doi)+'</a></dd></div>':'')+'</dl><div class="paper-dialog-actions"><a class="button button-primary" href="'+esc(titleLink(p))+'" target="_blank" rel="noopener noreferrer">'+(p.url||p.doi?t('article'):t('find'))+icons.external+'</a><button class="button button-outline" id="copy-reference">'+t('copyCitation')+'</button><button class="button button-outline" id="download-bibtex">'+icons.download+t('bibtex')+'</button></div><div class="citation-block"><label for="citation-text">'+t('citation')+'</label><textarea id="citation-text" class="citation-text" readonly>'+esc(referenceText(p))+'</textarea></div>';
 document.getElementById('close-paper').addEventListener('click',function(){box.close()});
 document.getElementById('copy-reference').addEventListener('click',function(){copyText(referenceText(p),t('citationCopied'),lang==='zh'?'引用已选中，请复制。':'Reference selected. Please copy the text.')});
 document.getElementById('download-bibtex').addEventListener('click',function(){const url=URL.createObjectURL(new Blob([bibtex(p)],{type:'application/x-bibtex;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ming_Liu_'+p.year+'_'+String(p.id).replace(/[^a-z0-9-]/gi,'')+'.bib';document.getElementById('paper-content').append(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},20000)});
 if(!box.open)box.showModal();box.scrollTop=0;
 try{history.replaceState(null,'','#paper-'+encodeURIComponent(p.id))}catch(e){}
}
let photoIndex=0;
function openPhoto(index){
 const m=DATA.activities[index];if(!m||m.kind==='video')return;photoIndex=index;
 const box=document.getElementById('lightbox');
 document.getElementById('lightbox-img').src=safeMedia(m.src||m.url);document.getElementById('lightbox-img').alt=local(m.title);
 document.getElementById('lightbox-caption').textContent=[local(m.title),local(m.location),m.date,local(m.caption)].filter(Boolean).join(' · ');
 box.setAttribute('aria-label',t('photo'));document.querySelector('.lightbox-close').setAttribute('aria-label',t('close'));
 const photos=DATA.activities.map(function(m,i){return m.kind!=='video'?i:null}).filter(function(i){return i!==null});
 document.getElementById('gallery-nav').hidden=photos.length<2;
 document.getElementById('photo-position').textContent=(photos.indexOf(index)+1)+' / '+photos.length;
 document.getElementById('photo-prev').textContent='← '+t('previous');document.getElementById('photo-next').textContent=t('next')+' →';
 if(!box.open)box.showModal();
}
function movePhoto(direction){const photos=DATA.activities.map(function(m,i){return m.kind!=='video'?i:null}).filter(function(i){return i!==null});if(photos.length)openPhoto(photos[(photos.indexOf(photoIndex)+direction+photos.length)%photos.length])}
document.getElementById('photo-prev').addEventListener('click',function(){movePhoto(-1)});
document.getElementById('photo-next').addEventListener('click',function(){movePhoto(1)});
document.getElementById('lightbox').addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){e.preventDefault();movePhoto(-1)}if(e.key==='ArrowRight'){e.preventDefault();movePhoto(1)}});
const paperDialog=document.getElementById('paper-dialog');
paperDialog.addEventListener('click',function(e){if(e.target===paperDialog)paperDialog.close()});
paperDialog.addEventListener('close',function(){if(location.hash.startsWith('#paper-')){try{history.replaceState(null,'','#publications')}catch(e){}}});
function openHashPaper(){if(location.hash.startsWith('#paper-')){try{openPaper(decodeURIComponent(location.hash.slice(7)))}catch(e){}}}
window.addEventListener('hashchange',openHashPaper);

let toastTimer;
function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},2300)}
const dialog=document.getElementById('lightbox');
document.querySelector('.lightbox-close').addEventListener('click',function(){dialog.close()});
dialog.addEventListener('click',function(event){if(event.target===dialog)dialog.close()});
render();
openHashPaper();
})();
</script>
</body>
</html>
