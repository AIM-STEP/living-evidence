<style>

.prisma th{font-weight:400;text-align:left}.prisma th.indent{padding-left:28px;color:var(--muted)}.prisma{max-width:520px}
.full-feed .feed-pass{width:64px;white-space:nowrap}
.brand-text{display:flex;flex-direction:column;line-height:1}.brand .brand-main{font-size:16px;letter-spacing:.08em;line-height:1.05}.brand .brand-sub{display:block;margin-top:3px;font-size:11px;line-height:1.2;letter-spacing:.01em;font-weight:500;color:#5f5862;text-transform:none;white-space:nowrap}
.step-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--plum);border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;line-height:1.2;letter-spacing:0;text-decoration:none;white-space:nowrap;cursor:pointer}.step-btn:hover{text-decoration:none}.step-btn.back,.step-btn.next{background:#fff;color:var(--plum);border:0}.step-btn.back:hover,.step-btn.next:hover{background:#f8eff6;color:var(--plum)}.step-tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:10px;background:#f8eff6;color:var(--plum);font-size:11px;font-weight:600;vertical-align:1px}
.input.compact,.select.compact{width:auto;min-height:30px;padding:4px 8px;font-size:12px}.link-btn{border:0;background:none;padding:0;color:var(--plum);font:inherit;font-weight:600;cursor:pointer}.link-btn:hover{text-decoration:underline}
.outcome-pick{margin:0 0 10px;gap:8px}.outcome-pick .label{margin:0}#outcome-select{min-width:320px;max-width:100%}
.net-wrap{display:flex;flex-direction:column;align-items:center;margin:8px 0}.net{width:100%;max-width:560px;height:auto}.net line{stroke:#b48aa9}.net circle{fill:var(--plum)}.net text{font-size:12px;font-weight:600;fill:var(--ink)}.net .ec{font-size:10px;fill:var(--muted);text-anchor:middle;font-weight:400}
.data-details summary{cursor:pointer;font-weight:600;font-size:13px;margin:6px 0}
.grid{font-size:12px;width:100%}.grid th,.grid td{white-space:normal;padding:5px 8px;vertical-align:middle}.grid td.warn{color:var(--red);font-weight:700}
.model-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px;align-items:end}.model-grid .label{margin:0;display:flex;flex-direction:column;gap:4px}.model-grid .select,.model-grid .input{width:100%}.bayes-set{margin-top:12px;padding-top:10px;border-top:1px solid var(--soft);grid-template-columns:auto repeat(4,minmax(0,1fr))}.set-title{font-size:12px;font-weight:700;color:var(--plum);align-self:center}
.forest-wrap{margin:0 0 12px}.forest{width:100%;max-width:760px;height:auto}.forest .lab{font-size:12px;fill:var(--ink)}.forest .lab.small{font-size:11px;fill:var(--muted)}.forest .num{font-size:11px;fill:var(--ink2)}.forest .num.b{fill:#3a4a7a}.forest .null{stroke:#9a9ca1;stroke-dasharray:3 3}.forest .cf{stroke:var(--plum);stroke-width:2}.forest .pf{fill:var(--plum)}.forest .cb{stroke:#3a4a7a;stroke-width:2}.forest .pb{fill:#3a4a7a}.forest .tick{font-size:10px;fill:var(--muted);text-anchor:middle}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 12px}.tab{border:1px solid transparent;border-bottom:0;background:none;padding:7px 14px;font-weight:600;font-size:13px;color:var(--ink2);border-radius:6px 6px 0 0;cursor:pointer}.tab[aria-pressed="true"]{border-color:var(--line);background:#fff;color:var(--plum);margin-bottom:-1px}
.league{font-size:11px;border-collapse:collapse;width:auto}.league td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}.league td.diag{background:var(--pale);color:var(--plum);font-weight:700}.league td.up{background:#f7f7f7;color:var(--ink2)}
.rank td,.rank th{text-align:center}.rank td:first-child{text-align:left;font-weight:600}
.coe-out{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}.coe-out label{display:inline-flex;align-items:center;gap:4px}
@media(max-width:760px){.model-grid,.bayes-set{grid-template-columns:1fr 1fr}.set-title{grid-column:1/-1}}
.step-foot{padding:14px 19px;border:1px solid var(--line);border-radius:6px;background:#fff}

/* Compact neutral controls shared with Full-text assess. */
.btn:not(.primary):not(.btn-primary):not(.btn-link):not(.activated):not([aria-pressed="true"]):hover:not(:disabled),.vote:not(.selected):hover:not(:disabled),.round:not(.current):not(.done):hover:not(:disabled),.pc-btn:not(.selected):hover:not(:disabled),.collapse-toggle:hover:not(:disabled){border-color:#d4cdd4;background:#f5f2f5;color:var(--plum)}
.btn:focus-visible,.vote:focus-visible,.round:focus-visible,.pc-btn:focus-visible,.collapse-toggle:focus-visible{outline:2px solid var(--plum);outline-offset:3px}
.vote:disabled,.round:disabled,.pc-btn:disabled,.collapse-toggle:disabled{opacity:.48;cursor:not-allowed}

/* Previous and next tools share the top navigation row. */
.heading.tool-navigation{display:flex;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:12px;width:100%;margin:0 0 20px}
.tool-navigation>.step-btn{min-width:0;max-width:calc(50% - 6px);white-space:normal}
.tool-navigation>.next{margin-left:auto;text-align:right;justify-content:flex-end}
.tool-navigation>.next:only-child{max-width:100%}
@media(max-width:620px){.tool-navigation>.step-btn{font-size:11px;padding:8px;line-height:1.35}}

.analysis-head{flex-wrap:wrap}.analysis-head>.toolbar{margin-left:auto}.toolbar svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7}.analysis-status{font-size:12px;color:#79548e;margin:8px 0;white-space:pre-wrap}.analysis-progress{height:18px;min-width:120px;flex:1 1 180px;max-width:500px;position:relative;background:#eee5f1;border-radius:8px;overflow:hidden;align-self:center}.analysis-progress span{display:block;height:100%;width:0;background:#79548e;transition:width .35s ease}.analysis-progress b{position:absolute;top:50%;left:clamp(20px,var(--progress,0%),calc(100% - 20px));transform:translate(-50%,-50%);font-size:10px;color:white;text-shadow:0 0 2px #493050}.data-grid input,.data-grid select{min-width:105px;max-width:180px;border:1px solid #e3dce6;border-radius:4px;padding:5px;font:inherit;background:#fff}.data-grid td{padding:4px}.data-grid th{white-space:nowrap}.data-grid .invalid{background:#fff1ef}.data-grid{max-height:420px;overflow:auto}.data-grid thead{position:sticky;top:0;z-index:1}.feedback{font-size:12px;margin:12px 0}.feedback li{margin:5px 0}.feedback .error{color:#a62828}.plan-card{border-top:1px solid #ede5ef;padding:12px 0}.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}.plan-grid label{font-size:12px}.plan-grid select,.plan-grid input{display:block;width:100%;padding:5px;border:1px solid #d8cddd;border-radius:4px}.document{white-space:pre-wrap;line-height:1.65;font-size:13px}.result-view svg{width:100%;height:auto;max-height:550px}.result-view article{padding:12px 0;border-bottom:1px solid #eee}.result-view .table-wrap{margin:14px 0}.result-view caption{text-align:left;margin:6px 0;color:#68546f}.result-view table{font-size:12px}.source-list{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:12px;color:#6c5975}.confirmed{color:#18794e}.inline-label{display:flex;gap:6px;align-items:center;font-size:12px}.requirements-input{min-height:115px}.plan-summary{min-height:80px}.analysis-tabs{display:flex;gap:12px;border-bottom:1px solid #eadfeb;margin:12px 0}.analysis-tabs button{border:0;background:none;padding:6px;color:#6e557a}.analysis-tabs button[aria-pressed=true]{border-bottom:2px solid #79548e}.stale-note{color:#986500;font-size:12px}.analysis-head h2{flex-shrink:0}@media(max-width:650px){.analysis-head>.toolbar{width:100%}.analysis-progress{max-width:none}.data-grid{max-height:350px}}
</style>
</head>

<header class="header">
<a class="brand" data-home href="index.html"><span class="brand-mark">A</span><span class="brand-text"><span class="brand-main">ACHIEVE</span><small class="brand-sub">for AIM-STEP Living evidence</small></span></a>

<main class="wrap">

<div class="layout"><div class="stack">
<section class="panel" id="data-panel"><div class="panel-head analysis-head"><h2>Data sources</h2><div class="toolbar"><button type="button" class="btn small" id="from-extraction">From Extraction</button><button type="button" class="btn small" id="import-data">Import from local</button><button type="button" class="btn small" id="clear-data"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg>Clear</button><button class="collapse-toggle" type="button" id="toggle-data" aria-expanded="true" aria-controls="data-body" aria-label="Collapse Data sources"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg></button></div></div><div class="panel-body" id="data-body">
<input type="file" id="data-files" accept=".csv,.tsv,.xlsx,.json,.txt" multiple hidden>
<div id="source-list" class="source-list"></div><p class="analysis-status" id="data-status" role="status" hidden></p>
<div id="data-editor" class="data-grid"></div><div id="data-feedback" class="feedback"></div>

</div></section>
<section class="panel" id="requirements-panel"><div class="panel-head analysis-head"><h2>Analysis Requirements</h2><div class="toolbar"><button type="button" class="btn small" id="import-requirements">Import from local</button><button type="button" class="btn small" id="clear-requirements"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg>Clear</button><button class="collapse-toggle" type="button" id="toggle-requirements" aria-expanded="true" aria-controls="requirements-body" aria-label="Collapse Analysis Requirements"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg></button></div></div><div class="panel-body" id="requirements-body">

<div class="toolbar" style="margin-top:10px"><button type="button" class="btn small" id="review-requirements">Review requirements</button><button type="button" class="btn small" id="confirm-requirements">Confirm requirements</button><button type="button" class="btn small" id="stop-requirements">Stop</button><span id="requirements-confirmed" class="analysis-status"></span></div>
<p id="requirements-status" class="analysis-status" role="status" hidden></p><div id="plan-editor"></div>
</div></section>
<section class="panel" id="results-panel"><div class="panel-head analysis-head"><h2>Analysis results</h2><div class="analysis-progress" id="analysis-progress" role="progressbar" aria-label="Analysis progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span><b>0%</b></div><div class="toolbar"><button type="button" class="btn small" id="start-analysis">Start</button><button type="button" class="btn small" id="stop-analysis">Stop</button><button type="button" class="btn small" id="export-analysis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg>Export</button><button type="button" class="btn small" id="clear-results"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg>Clear</button><button class="collapse-toggle" type="button" id="toggle-results" aria-expanded="true" aria-controls="results-body" aria-label="Collapse Analysis results"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg></button></div></div><div class="panel-body" id="results-body">
<p class="analysis-status" id="analysis-status" role="status"></p>
<div class="toolbar" id="run-picker" hidden><label class="inline-label">Saved run <select id="saved-runs" class="select compact"></select></label></div>
<p id="stale-note" class="stale-note" hidden>This saved run uses an earlier data or requirements snapshot.</p>
<div class="analysis-tabs" id="result-tabs" hidden><button type="button" data-view="results" aria-pressed="true">Results and figures</button><button type="button" data-view="interpretation" aria-pressed="false">Interpretation</button><button type="button" data-view="methods" aria-pressed="false">Methods</button></div>
<div id="result-view" class="result-view"></div>
</div></section>
