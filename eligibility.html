    if(!row){row={id:'INC-'+String(rows.length+1).padStart(2,'0'),title:domain,condition:'',uncertain:'',definition:'',purpose:'Eligibility',stage:''};rows.push(row);if(refinement)refinement.rows.push({dimension:domain,include:[],exclude:[]})}
    // The reviewer's rule replaces the placeholder clause the item flagged.
    if(sug.vague||sug.issue){const k=sug.vague?ruleKey(sentence(sug.vague)):'',drop=part=>{const c=sentence(part);return c&&(k?ruleKey(c)===k:ruleIssue(c)===sug.issue)};
      for(const f of ['condition','definition','uncertain'])row[f]=String(row[f]||'').split(/\n/).filter(line=>!line.split(/[;；]/).some(drop)).join('\n')}
    const field=d.decision==='meets'?'condition':'uncertain';
    row[field]=(row[field]?row[field].replace(/\s+$/,'')+'\n':'')+rule;
    if(refinement){const rr=refinement.rows.find(x=>x.dimension===domain);if(rr){if(sug.vague)rr.include=rr.include.filter(x=>ruleKey(x)!==ruleKey(sentence(sug.vague)));(d.decision==='meets'?rr.include:rr.exclude).push(rule)}}
  }
  if(refinement){refinement.uncertainties=refinement.uncertainties.filter(u=>!pending.includes(u));refinement.signature=machine?machineSourceSignature(state.machineRun?.question,state.machineRun?.reviewType,state.machineRun?.sourceRevision??0,state.machineCriteria):manualSourceSignature()}
  state.resolvedPending=[...new Set([...(state.resolvedPending||[]),...pending])];
  state.pendingDecisions=Object.fromEntries(Object.entries(decisions).filter(([item])=>!pending.includes(item)));
  state.clarificationGuidance=PENDING_CLARIFICATION_GUIDANCE;
  state.finalCriteria={at:new Date().toISOString(),count:(state.finalCriteria?.count||0)+pending.length,decisions:[...(state.finalCriteria?.decisions||[]),...log]};
  previewDirty=true;
  if(!save()){state=before;previewDirty=wasDirty;renderCards();renderPreview();toast('Could not save your choice. Please try again.');return false;}
  previewDirty=wasDirty;renderCards();renderPreview();
  toast('Clarification saved.');return true;
}
$('preview').addEventListener('click',e=>{
  const button=e.target.closest('[data-pc-dec]');
  if(!button)return;
  const item=currentPending()[Number(button.dataset.pcI)];
  if(item!==undefined)recordPendingChoice(item,button.dataset.pcDec);
});
// Reuse this exact manual editor in Full-text assess, with an isolated draft.
if(embeddedManual){
  window.aimstepManualEditor={
    load(snapshot={}){
      stopManualRefinement();stopMachineGeneration();
      const draft=structuredClone(snapshot.manualEditor||{});
      state={...state,...draft,question:snapshot.question||'',framework:draft.framework||snapshot.framework||'Other',
        criteria:structuredClone(draft.criteria||snapshot.rows||[]).filter(r=>r.id!=='FT-limits'),reviewType:draft.reviewType||snapshot.reviewType||'Systematic Review',
        activeGenerator:'manual',generationMethodChoice:'manual',machineCriteria:[],machineRun:null,machineRefinement:null,
        manualRefinement:null,dateRange:{},language:'',limitsOther:'',
        pendingDecisions:draft.pendingDecisions||{},finalCriteria:draft.finalCriteria||null,confirmed:false};
      setManualStatus('');fill();picker.hidden=true;
    },
    read(){
      save();
      const rows=state.criteria.map((r,i)=>({id:'FT-'+(i+1),title:String(r.title||'').trim(),
        condition:String(r.condition||'').trim(),uncertain:String(r.uncertain||'').trim(),definition:String(r.definition||'').trim()}));
      const {framework,reviewType,criteria}=state;
      return structuredClone({rows,framework,reviewType,manualEditor:{framework,reviewType,criteria}});
    },
    stop(){stopManualRefinement();stopMachineGeneration();}
  };
  window.aimstepManualEditor.load();
}else fill();
})();

// Collapse / expand each section. The head keeps its buttons; footers with
// Next or Download stay visible. Remembered per browser, page and project.
(()=>{
  if(new URLSearchParams(location.search).get('embedded')==='fulltext-criteria')return;
  const q=new URLSearchParams(location.search),pid=q.get('projectId')||q.get('project')||'default',page=(location.pathname.split('/').pop()||'page').replace(/\.html$/,'');
  const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>';
  document.querySelectorAll('.editor > .section, aside .panel').forEach(box=>{
    const head=[...box.children].find(el=>el.matches('.section-head,.panel-head,.criteria-heading'));
    if(!head||head.querySelector('.collapse-toggle'))return;
    const name=(head.querySelector('h2')?.textContent||'section').replace(/\s+/g,' ').trim(),key='aimstep-collapsed:'+page+':'+pid+':'+name;
    // Everything after the title goes to the right, with the toggle last.
    const actions=document.createElement('div');actions.className='head-actions';
    [...head.children].slice(1).forEach(el=>actions.appendChild(el));
    const btn=document.createElement('button');btn.type='button';btn.className='collapse-toggle';btn.innerHTML=icon+'<span class="sr-only"></span>';
    actions.appendChild(btn);head.appendChild(actions);head.classList.add('has-collapse');
    const set=c=>{box.classList.toggle('is-collapsed',c);btn.setAttribute('aria-expanded',String(!c));const t=(c?'Expand ':'Collapse ')+name;btn.title=t;btn.querySelector('.sr-only').textContent=t};
    let saved=false;try{saved=localStorage.getItem(key)==='1'}catch(e){}
    set(saved);
    btn.addEventListener('click',()=>{const c=!box.classList.contains('is-collapsed');set(c);try{localStorage.setItem(key,c?'1':'0')}catch(e){}});
  });
})();
