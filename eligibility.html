    put('outcomes',pick(/\b(?:reduce|improve|increase|decrease|affect|prevent|change|lower)\s+(.+?)(?=\s+(?:in|among)\b|[?.]|$)/i));
    put('outcomes',pick(/\b(?:effect|effects|impact|effectiveness|efficacy)\s+of\s+.+?\s+on\s+(.+?)(?=\s+(?:in|among)\b|[?.]|$)/i));
    const association=text.match(/\b(?:association|relationship)\s+between\s+(.+?)\s+and\s+(.+?)(?=\s+(?:in|among)\b|[?.]|$)/i);if(association){put('exposure',association[1]);put('outcomes',association[2])}

    put('interest',pick(/\b(?:experiences|perceptions|views)\s+(?:of|about)\s+(.+?)(?=\s+(?:in|among|within)\b|[?.]|$)/i));
    if(framework==='PCC'||framework==='PICo')put('context',pick(/\b(?:in|within|across)\s+(.+?)(?=[?.]|$)/i));
    put('population',pick(/(?:在|针对|面向)(.+?)(?:人群)?中[，,:：]?/));
    const chineseBody=text.replace(/^(?:在|针对|面向).+?中[，,:：]?\s*/,''),comp=chineseBody.match(/(?:与|和|相较于|相比于)(.+?)(?:相比|比较|对比)/);if(comp){put('comparison',comp[1]);put('intervention',chineseBody.split(/(?:与|和|相较于|相比于)/)[0])}
    if(!comp){const intervention=chineseBody.match(/^(.+?)(?:是否|能否)(?:降低|减少|改善|提高|增加|影响|预防|缓解|改变)/);if(intervention)put('intervention',intervention[1])}
    put('outcomes',pick(/(?:降低|减少|改善|提高|增加|影响|预防|缓解|改变)(.+?)(?=[？?。]|$)/));
    const design=text.match(/\b(?:randomi[sz]ed controlled trials?|cohort studies|cohort study|case-control studies|cross-sectional studies|qualitative studies)\b|随机对照试验|队列研究|病例对照研究|横断面研究|定性研究|质性研究/i);if(design)put('study',design[0]);
  }
  const types=criterionTypesByFramework[framework]||criterionTypesByFramework.Other;

  const noRule=zh?'问题中未说明；请按需补充。':'Not specified in the question; define if needed.',noExclusion=zh?'未指定排除标准。':'No exclusion rule specified.';
  const inclusion={population:v=>zh?`纳入研究对象符合以下范围的研究：${v}。`:`Include studies involving: ${v}.`,intervention:v=>zh?`纳入评估以下干预的研究：${v}。`:`Include studies evaluating: ${v}.`,exposure:v=>zh?`纳入评估以下暴露的研究：${v}。`:`Include studies evaluating the exposure: ${v}.`,comparison:v=>zh?`拟采用的对照：${v}；是否必须具有此对照需确认。`:`Comparator of interest: ${v}. Confirm whether this comparator is required.`,outcomes:v=>zh?`关注的结局：${v}；是否以报告此结局为纳入条件需确认。`:`Outcomes of interest: ${v}. Confirm whether outcome reporting is required for inclusion.`,study:v=>zh?`纳入以下研究设计：${v}。`:`Include the following study designs: ${v}.`,concept:v=>zh?`纳入涉及以下概念的研究：${v}。`:`Include studies addressing: ${v}.`,context:v=>zh?`纳入以下情境中的研究：${v}。`:`Include studies in the context: ${v}.`,interest:v=>zh?`纳入探讨以下现象的研究：${v}。`:`Include studies exploring: ${v}.`,other:v=>v};

function generateMachineCriteria(){
  clearTimeout(generationTimer);generationTimer=null;if($('generation-method').value!=='machine')return;const question=$('question').value.trim();
  if(!question){state.machineCriteria=[];state.generationMode='machine';state.activeGenerator='machine';generationStatus.textContent='Enter a question to generate a criteria draft. Check and refine it before screening.';renderCards();renderPicker();save();return}
  state.machineCriteria=draftFromQuestion(question,state.framework);state.activeGenerator='machine';state.generationMode='machine';state.generationMethod='local-rules';state.confirmed=false;
  generationStatus.textContent='Rule-based draft generated. Complete unspecified rules and review the criteria before screening.';
  renderCards();renderPicker();save();
}
function scheduleMachineGeneration(){if($('generation-method').value!=='machine')return;clearTimeout(generationTimer);generationStatus.textContent='Updating criteria draft…';state.confirmed=false;save();generationTimer=setTimeout(generateMachineCriteria,650)}

function renderPicker(){const types=criterionTypesByFramework[state.framework]||criterionTypesByFramework.Other;picker.innerHTML=types.map(t=>{const added=state.criteria.some(c=>c.typeKey===t.key||c.title===t.title);return `<button type="button" class="criterion-option" data-add-type="${t.key}" ${added?'disabled':''}>${t.id} ${t.title}${added?' · Added':''}</button>`}).join('');picker.querySelectorAll('[data-add-type]:not(:disabled)').forEach(button=>button.addEventListener('click',()=>{const type=types.find(t=>t.key===button.dataset.addType);if(!type||state.criteria.some(c=>c.typeKey===type.key||c.title===type.title))return;markManual();state.criteria.push({id:type.id,typeKey:type.key,title:type.title,condition:'',definition:'',purpose:'Eligibility',stage:'',uncertain:''});$('add-criterion').setAttribute('aria-expanded','false');picker.hidden=true;renderCards();save();const card=list.lastElementChild;if(card)card.scrollIntoView({behavior:'smooth',block:'nearest'})}))}

function renderPreview(){const area=$('preview');if(!$('generation-method').value){area.innerHTML='';$('download').hidden=true;return}$('download').hidden=false;const visibleCriteria=state.activeGenerator==='machine'?state.machineCriteria:state.criteria;const rows=visibleCriteria.map(c=>`<tr><td><strong>${escapeHtml(c.title)}</strong></td><td>${escapeHtml(c.condition||'')}${c.definition?`<span class="other-rule">Other rule: ${escapeHtml(c.definition)}</span>`:''}</td><td>${escapeHtml(c.uncertain||'')}</td></tr>`).join('');area.innerHTML=`<div class="criteria-table-wrap"><table class="criteria-table"><thead><tr><th>Criterion dimension</th><th>Eligibility rule</th><th>Exclusion rule</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="empty">No criteria added yet.</td></tr>'}</tbody></table></div>`}
function xmlEscape(value){return String(value==null?'':value).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}

function wordCell(value,width,bold){return '<w:tc><w:tcPr><w:tcW w:w="'+width+'" w:type="dxa"/><w:vAlign w:val="top"/></w:tcPr>'+wordParagraph(value,bold)+'</w:tc>'}

function criteriaWordFile(){const criteria=state.activeGenerator==='machine'?state.machineCriteria:state.criteria,widths=[3000,4200,2160],headers=['Criterion dimension','Eligibility rule','Exclusion rule'];const rows=[headers,...criteria.map(c=>[c.title||'',(c.condition||'')+(c.definition?'\nOther rule: '+c.definition:''),c.uncertain||''])];const border='<w:top w:val="single" w:sz="6" w:color="000000"/><w:left w:val="single" w:sz="6" w:color="000000"/><w:bottom w:val="single" w:sz="6" w:color="000000"/><w:right w:val="single" w:sz="6" w:color="000000"/><w:insideH w:val="single" w:sz="6" w:color="000000"/><w:insideV w:val="single" w:sz="6" w:color="000000"/>',tableRows=rows.map((row,index)=>'<w:tr>'+row.map((cell,column)=>wordCell(cell,widths[column],index===0)).join('')+'</w:tr>').join('');const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+wordParagraph('Eligibility criteria',true)+'<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/><w:tblBorders>'+border+'</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>'+widths.map(width=>'<w:gridCol w:w="'+width+'"/>').join('')+'</w:tblGrid>'+tableRows+'</w:tbl><w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>',contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>',relationships='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relations
