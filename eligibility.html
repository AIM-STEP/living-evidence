function criteriaWordFile(){const criteria=state.activeGenerator==='machine'?state.machineCriteria:state.criteria,widths=[3000,4200,2160],headers=['Criterion dimension','Eligibility rule','Exclusion rule'];const rows=[headers,...criteria.map(c=>[c.title||'',(c.condition||'')+(c.definition?'\nOther rule: '+c.definition:''),c.uncertain||''])];const border='<w:top w:val="single" w:sz="6" w:color="000000"/><w:left w:val="single" w:sz="6" w:color="000000"/><w:bottom w:val="single" w:sz="6" w:color="000000"/><w:right w:val="single" w:sz="6" w:color="000000"/><w:insideH w:val="single" w:sz="6" w:color="000000"/><w:insideV w:val="single" w:sz="6" w:color="000000"/>',tableRows=rows.map((row,index)=>'<w:tr>'+row.map((cell,column)=>wordCell(cell,widths[column],index===0)).join('')+'</w:tr>').join('');const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+wordParagraph('Eligibility criteria',true)+'<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/><w:tblBorders>'+border+'</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>'+widths.map(width=>'<w:gridCol w:w="'+width+'"/>').join('')+'</w:tblGrid>'+tableRows+'</w:tbl><w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>',contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>',relationships='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';return makeStoredZip([{name:'[Content_Types].xml',content:contentTypes},{name:'_rels/.rels',content:relationships},{name:'word/document.xml',content:documentXml}])}
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
function fill(){ $('question').value=state.question||'';$('generation-method').value=state.generationMethodChoice||'';$('machine-model').value=state.machineModelSlot==='B'?'B':'A';$('machine-model-choice').hidden=$('generation-method').value!=='machine';$('machine-generate-panel').hidden=$('generation-method').value!=='machine';$('manual-generate-panel').hidden=$('generation-method').value!=='manual';const reviewOption=[...$('review-type').options].find(option=>option.value.toLowerCase()===String(state.reviewType||'Systematic Review').toLowerCase());$('review-type').value=reviewOption?reviewOption.value:'Systematic Review';document.querySelectorAll('.framework').forEach(b=>b.classList.toggle('selected',b.dataset.framework===state.framework));const dateRange=state.dateRange||{};$('start-date').value=dateToInput(dateRange.start,'start');$('end-date').value=dateToInput(dateRange.end,'end');const savedLanguage=['No restriction','Specify languages'].includes(state.language)?'':state.language||'';$('language').value=savedLanguage;$('limits-other').value=state.limitsOther||'';renderCards();renderPicker();renderPreview()}
const helpButton=$('framework-help-button'),helpPopup=$('framework-help-popup');helpButton.addEventListener('click',e=>{e.stopPropagation();const open=helpButton.getAttribute('aria-expanded')!=='true';helpButton.setAttribute('aria-expanded',String(open));helpPopup.hidden=!open});document.addEventListener('click',e=>{if(!e.target.closest('.framework-help')){helpPopup.hidden=true;helpButton.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){helpPopup.hidden=true;helpButton.setAttribute('aria-expanded','false');helpButton.focus()}});
$('generation-method').addEventListener('change',()=>{stopMachineGeneration();abortVoiceInput();setMachineStatus('');const mode=$('generation-method').value;state.generationMethodChoice=mode;state.activeGenerator=mode;state.generationMode=mode==='machine'?'machine':mode==='manual'?'manual':'';$('machine-model-choice').hidden=mode!=='machine';$('machine-generate-panel').hidden=mode!=='machine';$('manual-generate-panel').hidden=mode!=='manual';renderPreview();save()});
$('machine-model').addEventListener('change',()=>{stopMachineGeneration();setMachineStatus('');state.confirmed=false;save()});
$('start-machine').addEventListener('click',generateMachineCriteria);
$('add-source').addEventListener('click',()=>$('source-files').click());
$('source-files').addEventListener('change',event=>{
  const files=Array.from(event.target.files||[]);event.target.value='';if(!files.length)return;
  const supported=/\.(?:docx|pdf|txt|md|csv|png|jpg|jpeg|webp)$/i;
  if(attachedFiles.length+files.length>5){setMachineStatus('Attach at most five files at a time.',true);return}
  if([...attachedFiles.map(entry=>entry.file),...files].reduce((sum,file)=>sum+file.size,0)>25*1024*1024){setMachineStatus('Attached files exceed 25 MB in total.',true);return}
  for(const file of files){if(!supported.test(file.name)){setMachineStatus(file.name+': use .docx, .pdf, text, or a PNG/JPEG/WebP image.',true);return}const image=/\.(?:png|jpg|jpeg|webp)$/i.test(file.name);if(file.size>(image?6:15)*1024*1024){setMachineStatus(file.name+': file exceeds the '+(image?'6':'15')+' MB limit.',true);return}}
  stopMachineGeneration();for(const file of files)attachedFiles.push({id:++nextAttachmentId,file});
  state.machineSourceRevision=(Number(state.machineSourceRevision)||0)+1;state.confirmed=false;setMachineStatus('');renderAttachments();save();
});
$('voice-toggle').addEventListener('click',toggleVoiceInput);
$('clear-question').addEventListener('click',()=>{stopMachineGeneration();abortVoiceInput();$('question').value='';state.confirmed=false;setMachineStatus('');save();$('question').focus()});
document.querySelectorAll('.framework').forEach(b=>b.addEventListener('click',()=>{markManual();state.framework=b.dataset.framework;state.confirmed=false;document.querySelectorAll('.framework').forEach(x=>x.classList.toggle('selected',x===b));renderPicker();save()}));
$('manual-generate').addEventListener('click',()=>{stopMachineGeneration();abortVoiceInput();attachedFiles.length=0;state.machineSourceRevision=(Number(state.machineSourceRevision)||0)+1;renderAttachments();state.question='';$('question').value='';state.criteria=[];state.machineCriteria=[];state.dateRange={start:{year:'',month:'',day:''},end:{year:'',month:'',day:''}};['start-date','end-date','limits-other'].forEach(id=>$(id).value='');$('language').value='';state.years='';state.dateEnd='';state.reportType='';state.reportTypeOther='';state.limitsReason='';state.outcomeGate=false;state.outcomeReason='';state.generationMode='manual';state.activeGenerator='manual';state.generationMethodChoice='manual';$('generation-method').value='manual';state.confirmed=false;setMachineStatus('');picker.hidden=true;$('add-criterion').setAttribute('aria-expanded','false');renderCards();renderPicker();save();toast('All entered eligibility content cleared.')});
$('add-criterion').addEventListener('click',()=>{markManual();const open=picker.hidden;renderPicker();picker.hidden=!open;$('add-criterion').setAttribute('aria-expanded',String(open));save()});
let composingQuestion=false;
$('question').addEventListener('compositionstart',()=>{composingQuestion=true;stopMachineGeneration()});
$('question').addEventListener('compositionend',()=>{composingQuestion=false;state.confirmed=false;setMachineStatus('');save()});
$('question').addEventListener('input',event=>{if(!composingQuestion&&!event.isComposing){stopMachineGeneration();abortVoiceInput();state.confirmed=false;setMachineStatus('');save()}});
$('review-type').addEventListener('input',()=>{stopMachineGeneration();state.confirmed=false;setMachineStatus('');save()});
['start-date','end-date','limits-other'].forEach(id=>$(id).addEventListener('input',()=>{state.confirmed=false;save()}));$('language').addEventListener('change',()=>{state.confirmed=false;save()});
$('download').addEventListener('click',()=>{save();const blob=new Blob([criteriaWordFile()],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eligibility-criteria'+(projectId?'-'+projectId:'')+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$('next-search-strategy').addEventListener('click',event=>{
  const mode=$('generation-method').value;
  if(generationController||voiceRecognition){event.preventDefault();toast('Finish the voice input or wait for generation to complete.');return}
  if(mode==='machine'&&(!state.machineRun||state.machineRun.slot!==$('machine-model').value||state.machineRun.question!==$('question').value.trim()||state.machineRun.reviewType!==$('review-type').value||(state.machineRun.sourceRevision??0)!==(Number(state.machineSourceRevision)||0))){event.preventDefault();toast('Click Start to generate criteria with the current text and files.');return}
  const rows=mode==='machine'?state.machineCriteria:state.criteria;
  if(!mode||!rows.length||!rows.some(row=>String(row.condition||'').trim())){
    event.preventDefault();toast('Choose a generation method and enter eligibility criteria before continuing.');return;
  }
  if(!save()){event.preventDefault();toast('The criteria could not be saved on this device.');return}
  if(completionKey){
    try{
      const done=JSON.parse(localStorage.getItem(completionKey)||'[]');
      const steps=Array.isArray(done)?done.map(Number).filter(Number.isInteger):[];
      if(!steps.includes(1))steps.push(1);
      localStorage.setItem(completionKey,JSON.stringify(steps));
      if(parent!==window&&parent.location.origin===location.origin)parent.AIMSTEP?.setSetupStepCompleted?.(1,true);
    }catch(e){}
  }
  try{sessionStorage.setItem('aimstep-eligibility-handoff:'+(projectId||'default'),String(Date.now()))}catch(e){}
});
$('lang').addEventListener('click',()=>{lang=lang==='en'?'zh':'en';$('lang').textContent=lang==='en'?'中文':'English';toast(lang==='zh'?'目前此页面的工作内容以英文保存。':'Page labels and criteria are currently in English.')});
fill();
})();
</script>
</body></html>
