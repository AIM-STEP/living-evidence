  if(!pending.length||pending.some(item=>!decisions[item]?.decision))return;
  const machine=state.activeGenerator==='machine',rows=machine?state.machineCriteria:state.criteria;
  // The polished wording stays valid only if it is updated with the rows.
  const refinement=machine?(state.machineRefinement?.signature===machineSourceSignature(state.machineRun?.question,state.machineRun?.reviewType,state.machineRun?.sourceRevision??0,state.machineCriteria)?state.machineRefinement:null)
    :(state.manualRefinement?.signature===manualSourceSignature()?state.manualRefinement:null);
  const log=[];
  for(const item of pending){
    const d=decisions[item],sug=pendingSuggestion(item),domain=d.domain||sug.domain,rule=sug.kind==='review'||sug.kind==='proposal'&&d.decision==='fails'?'':sentence(d.text??sug.text);
    if(sug.kind==='question'&&!rule){state=before;return false;}
    log.push({item,decision:d.decision,domain,rule,kind:sug.kind||'legacy',side:sug.side||null,evidence:clarificationDetail(item)?.evidence||[],at:new Date().toISOString(),provenance:'author-decision'});
    if(!rule)continue;
    let row=rows.find(r=>r.title===domain);
    if(!row){row={id:'INC-'+String(rows.length+1).padStart(2,'0'),title:domain,condition:'',uncertain:'',definition:'',purpose:'Eligibility',stage:''};rows.push(row);if(refinement)refinement.rows.push({dimension:domain,include:[],exclude:[]})}
    // The reviewer's rule replaces the placeholder clause the item flagged.
    if(sug.vague||sug.issue){const k=sug.vague?ruleKey(sentence(sug.vague)):'',drop=part=>{const c=sentence(part);return c&&(k?ruleKey(c)===k:ruleIssue(c)===sug.issue)};
      for(const f of ['condition','definition','uncertain'])row[f]=String(row[f]||'').split(/\n/).filter(line=>!line.split(/[;；]/).some(drop)).join('\n')}
    const include=sug.kind==='proposal'?sug.side!=='exclude':d.decision==='meets';
    const field=include?'condition':'uncertain';
    row[field]=(row[field]?row[field].replace(/\s+$/,'')+'\n':'')+rule;
    if(refinement){const rr=refinement.rows.find(x=>x.dimension===domain);if(rr){if(sug.vague)rr.include=rr.include.filter(x=>ruleKey(x)!==ruleKey(sentence(sug.vague)));(include?rr.include:rr.exclude).push(rule)}}
  }
  if(refinement){
    refinement.uncertainties=refinement.uncertainties.filter(u=>!pending.includes(u));
    refinement.signature=machine?machineSourceSignature(state.machineRun?.question,state.machineRun?.reviewType,state.machineRun?.sourceRevision??0,state.machineCriteria):manualSourceSignature();
    if(log.some(decision=>decision.rule)){
      refinement.descriptionEditedByAuthor=false;
      refinement.manuscriptParagraph=manuscriptDraft(refinement.rows.map(row=>({label:row.dimension,include:row.include,exclude:row.exclude})),refinement.rows.flatMap(row=>row.exclude.map(rule=>({rule,domains:[row.dimension]}))),previewLimits([]));
    }
    if(refinement.audit)refinement.audit={...refinement.audit,status:'author-reviewed',decisions:[...(refinement.audit.decisions||[]),...log]};
  }
  state.visibleDescription=null;
  state.resolvedPending=[...new Set([...(state.resolvedPending||[]),...pending])];
  state.pendingDecisions=Object.fromEntries(Object.entries(decisions).filter(([item])=>!pending.includes(item)));
  state.clarificationGuidance=PENDING_CLARIFICATION_GUIDANCE;
  state.finalCriteria={at:new Date().toISOString(),count:(state.finalCriteria?.count||0)+pending.length,decisions:[...(state.finalCriteria?.decisions||[]),...log]};
  previewDirty=true;
  if(!save()){state=before;previewDirty=wasDirty;renderCards();renderPreview();toast('Could not save your choice. Please try again.');return false;}
  previewDirty=wasDirty;renderCards();renderPreview();
  toast('Criteria saved.');return true;
}
function applyScopeSuggestion(index,action){
  if(!['adopt','keep'].includes(action)||!Number.isInteger(index)||index<0||index>1)return false;
  if(previewDirty&&!savePreviewEdits(false))return false;
  const refinement=currentRefinement(),detail=refinement?.scopeSuggestions?.[index];
  if(!detail||detail.status!=='suggested')return false;
  stopMachineGeneration();stopManualRefinement();
  const before=structuredClone(state);
  detail.status=action==='adopt'?'adopted':'dismissed';
  state.pendingDecisions={...(state.pendingDecisions||{}),[detail.item]:{decision:action==='adopt'?'meets':'fails',domain:detail.domain,text:detail.text}};
  if(!generateFinalCriteria([detail.item])){state=before;renderCards();renderPreview();return false;}
  return true;
}
async function confirmBackgroundIssue(detail,choice,answerField,targetField){
  if(refreshAfterExternalClear())return false;
  let answer=null,option;if(choice==='answer'){const index=currentRefinement()?.sourceConfirmations?.indexOf(detail),field=answerField||document.querySelector('[data-source-answer=\"'+index+'\"]');answer=field?.value;if(!answer?.trim()){field?.focus();toast('Enter your clarification first.');return false;}}else{if(choice<0){toast('This issue remains pending.');return false;}option=detail.options[choice];if(!option)return false;}
  let targetId;
  if(detail.answerTargets?.length>1){
    targetId=targetField?.value;
    if(targetId!=='*'&&!detail.answerTargets.some(target=>target.id===targetId)){
      targetField?.focus();toast('Choose which criterion your answer applies to.');return false;
    }
  }
  const issueId=detail.issue_id;
  if(!confirmationQueue||confirmationQueue.run!==generationNonce){
    stopMachineGeneration();stopManualRefinement();
    const controller=new AbortController();
    generationController=controller;
    confirmationQueue={run:generationNonce,signal:controller.signal,issues:new Set(),tail:Promise.resolve()};
  }
  const queue=confirmationQueue;
  const submissionKey=JSON.stringify([issueId,targetId||'*']);
  if(queue.issues.has(submissionKey)||queue.issues.has(JSON.stringify([issueId,'*'])))return false;
  queue.issues.add(submissionKey);
  const request={criteriaEpoch:state.criteria_epoch??null,issue_id:issueId,option_id:option?.option_id,answer_text:answer||option?.label,...(targetId?{target_id:targetId}:{}),signal:queue.signal};
  const active=()=>queue.run===generationNonce&&!queue.signal.aborted&&!refreshAfterExternalClear();
  const apply=async()=>{
    if(!active())return false;
    const before=structuredClone(state);
    try{
      const service=await getEligibilityBackground();
      if(!active())return false;
      const stage=await service.decide(request);
      if(!active())return false;
      const decision=stage.project.decisions.at(-1),confirmed=stage.project.criteria.filter(c=>c.source_decision_ids.includes(decision.decision_id));
      useBackgroundCriteria(stage,state.machineRun,false);
      if(!detail.methodAdvice||confirmed.length)state.finalCriteria={at:new Date().toISOString(),count:(state.finalCriteria?.count||0)+1,decisions:[...(state.finalCriteria?.decisions||[]),...confirmed.map(c=>({item:detail.text,domain:stage.classic.rows.find(row=>row[c.disposition].includes(c.text))?.dimension||detail.domain,rule:c.text,decision:c.disposition==='include'?'meets':'fails',side:c.disposition,kind:'proposal',at:new Date().toISOString(),provenance:'author-decision',decision_id:decision.decision_id}))]};
      if(!save({updateEntry:true}))throw Error('Could not save this decision. Your previous criteria have been kept.');
      toast('Criteria saved.');return true;
    }catch(error){
      if(!active())return false;
      state=before;pendingBackgroundStage=null;renderPreview();(state.generationMethodChoice==='manual'?setManualStatus:setMachineStatus)(backgroundErrorMessage(error),true);return false;
    }
  };
  const saved=queue.tail.then(apply);
  queue.tail=saved.catch(()=>false);
  try{return await saved;}
  finally{
    queue.issues.delete(submissionKey);
    if(!queue.issues.size&&confirmationQueue===queue){
      confirmationQueue=null;
      if(queue.run===generationNonce)generationController=null;
    }
  }
}
function confirmSourceRule(index,choice,answerField,targetField){
  const backgroundDetail=currentRefinement()?.sourceConfirmations?.[index];
  if(backgroundDetail?.backgroundIssue){if(embeddedPreview||embeddedManual)return false;if(previewDirty&&!savePreviewEdits(false))return false;return confirmBackgroundIssue(backgroundDetail,choice,answerField,targetField);}
  if(!Number.isInteger(index)||index<0||!Number.isInteger(choice)||choice<0)return false;
  if(previewDirty&&!savePreviewEdits(false))return false;
  const machine=state.activeGenerator==='machine',refinement=currentRefinement(),detail=refinement?.sourceConfirmations?.[index],option=detail?.options?.[choice];
  if(!option||detail.status!=='suggested')return false;
  stopMachineGeneration();stopManualRefinement();
  const before=structuredClone(state),keys=new Set(detail.options.map(option=>ruleKey(option.text)));
  detail.status='confirmed';detail.text=option.text;detail.side=option.side;detail.selectedOption=choice;
  // Replace the ambiguous alternatives, retaining every unrelated criterion.
  const rows=machine?state.machineCriteria:state.criteria,row=rows.find(row=>row.title===detail.domain),polished=refinement.rows.find(row=>row.dimension===detail.domain);
  if(row)for(const field of ['condition','uncertain','definition'])row[field]=ruleClauses(row[field],field==='uncertain'?'exclude':'include').filter(rule=>!keys.has(ruleKey(rule))).join('\n');
  if(polished)for(const side of ['include','exclude'])polished[side]=polished[side].filter(rule=>!keys.has(ruleKey(rule)));
  refinement.ruleEvidence=(refinement.ruleEvidence||[]).filter(link=>link.dimension!==detail.domain||!keys.has(ruleKey(link.text)));
  refinement.signature=machine?machineSourceSignature(state.machineRun?.question,state.machineRun?.reviewType,state.machineRun?.sourceRevision??0,state.machineCriteria):manualSourceSignature();
  state.pendingDecisions={...(state.pendingDecisions||{}),[detail.item]:{decision:'meets',domain:detail.domain,text:option.text}};
  if(!generateFinalCriteria([detail.item])){state=before;renderCards();renderPreview();return false;}
  return true;
}
$('preview').addEventListener('click',event=>{
  if(event.target?.closest?.('[data-retry-criteria-translation]')?.dataset?.retryCriteriaTranslation!==undefined){
    stopCriteriaTranslation();renderPreview();return;
  }
  const confirmation=event.target.closest('[data-source-confirm]');
  if(confirmation){
    const form=confirmation.closest('.source-confirmations');
    return confirmSourceRule(Number(confirmation.dataset.sourceConfirm),confirmation.dataset.sourceOption==='answer'?'answer':Number(confirmation.dataset.sourceOption),form?.querySelector('[data-source-answer]'),form?.querySelector('[data-source-target]'));
  }
  const button=event.target.closest('[data-scope-action]');if(!button)return;
  applyScopeSuggestion(Number(button.dataset.scopeIndex),button.dataset.scopeAction);
});
// Search uses this same preview and editing pipeline in an isolated draft.
if(embeddedPreview){
  const initial=window.AimstepEligibilityLibrary.blankWorkspace(state);
  window.aimstepCriteriaPreview={
    load(saved){stopMachineGeneration();stopManualRefinement();previewDirty=false;state={...structuredClone(initial),...structuredClone(saved)};fill();},
    read(){if(!savePreviewEdits(false))throw new Error('Could not prepare edited criteria.');return {workspace:structuredClone(state),summary:structuredClone(embeddedPreviewSummary)};},
    dirty(){return previewDirty;},
    clear(){return clearPreviewCriteria();},
    discard(){previewDirty=false;}
  };
  window.parent?.postMessage({type:'aimstep:criteria-preview-ready'},location.origin);
}
// Reuse this exact manual editor in Full-text assess, with an isolated draft.
if(embeddedManual){
  window.aimstepManualEditor={
    load(snapshot={}){
      stopManualRefinement();stopMachineGeneration();
      const draft=structuredClone(snapshot.manualEditor||{});
      state={...state,...draft,question:snapshot.question||'',framework:draft.framework||snapshot.framework||'Other',
        criteria:structuredClone(draft.criteria||snapshot.rows||[]).filter(r=>r.id!=='FT-limits'),reviewType:draft.reviewType||snapshot.reviewType||'Systematic Review',
        activeGenerator:'manual',generationMethodChoice:'manual',machineCriteria:[],machineRun:null,machineRefinement:null,
        manualRefinement:null,dateRange:{},language:'',limitsOther:'',
        pendingDecisions:draft.pendingDecisions||{},finalCriteria:draft.finalCriteria||null,confirmed:false};
      setManualStatus('');fill();picker.hidden=true;
    },
    read(){
      save();
      const rows=state.criteria.map((r,i)=>({id:'FT-'+(i+1),title:String(r.title||'').trim(),
        condition:String(r.condition||'').trim(),uncertain:String(r.uncertain||'').trim(),definition:String(r.definition||'').trim()}));
      const {framework,reviewType,criteria}=state;
      return structuredClone({rows,framework,reviewType,manualEditor:{framework,reviewType,criteria}});
    },
    stop(){stopManualRefinement();stopMachineGeneration();}
  };
  window.aimstepManualEditor.load();
}else{
 if(!embeddedPreview&&window.AimstepEligibilityLibrary){try{const saved=window.AimstepEligibilityLibrary.commit(localStorage,projectId,state);state.criteriaLibraryId=saved.criteriaLibraryId;}catch(error){toast('Could not save the criteria list on this device.');}}
 fill();
 if(hasRequiredAuthorChecks())clearPendingCompletion();
}
})();

// Collapse / expand each section. The head keeps its buttons; footers with
// Next or Download stay visible. Remembered per browser, page and project.
(()=>{
  if(['fulltext-criteria','search-criteria-preview'].includes(new URLSearchParams(location.search).get('embedded')))return;
  const q=new URLSearchParams(location.search),pid=q.get('projectId')||q.get('project')||'',page=(location.pathname.split('/').pop()||'page').replace(/\.html$/,'');
  const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>';
  document.querySelectorAll('.editor > .section, aside .panel').forEach(box=>{
    const head=[...box.children].find(el=>el.matches('.section-head,.panel-head,.criteria-heading'));
    if(!head||head.querySelector('.collapse-toggle'))return;
    const name=(head.querySelector('h2')?.textContent||head.dataset.collapseName||'section').replace(/\s+/g,' ').trim(),key='aimstep-collapsed:'+page+':'+pid+':'+name;
    const actions=document.createElement('div');actions.className='head-actions';
    [...head.children].slice(head.dataset.collapseName?0:1).filter(el=>!el.classList.contains('criteria-file-actions')).forEach(el=>actions.appendChild(el));
    const btn=document.createElement('button');btn.type='button';btn.className='collapse-toggle';btn.innerHTML=icon+'<span class="sr-only"></span>';
    actions.appendChild(btn);head.appendChild(actions);head.classList.add('has-collapse');
    const set=c=>{box.classList.toggle('is-collapsed',c);btn.setAttribute('aria-expanded',String(!c));const t=(c?'Expand ':'Collapse ')+name;btn.title=t;btn.querySelector('.sr-only').textContent=t};
    let saved=false;try{saved=localStorage.getItem(key)==='1'}catch(e){}
    set(saved);
    btn.addEventListener('click',()=>{const c=!box.classList.contains('is-collapsed');set(c);try{localStorage.setItem(key,c?'1':'0')}catch(e){}});
  });
})();

});
