<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | AIM-STEP</title>
    <style>
      :root {
        --bg: #f4f2f8;
        --ink: #1c1733;
        --ink-soft: #493f65;
        --muted: #6f6783;
        --line: rgba(28,23,51,0.12);
        --purple: #2e1f4a;
        --purple-2: #4b346d;
        --purple-3: #7b5bb2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f8f5fb, #f2eef8);
        color: var(--ink);
      }
      a { color: inherit; text-decoration: none; }
      .container { width: min(1040px, calc(100% - 40px)); margin: 0 auto; }
      .site-header { position: sticky; top: 0; z-index: 10; background: rgba(248,245,251,0.82); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
      .header-inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; }
      .brand-badge { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, var(--purple), var(--purple-2)); color: white; }
      .nav { display: flex; align-items: center; gap: 24px; color: var(--ink-soft); font-size: 0.8rem; }
      .nav a { position: relative; padding: 10px 0; }
      .nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--purple); transform: scaleX(0); transition: transform 0.2s ease; }
      .nav a:hover::after { transform: scaleX(1); }
      .page { padding: 5rem 0; }
      .card {
        background: rgba(255,255,255,0.72);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 2rem;
        box-shadow: 0 26px 60px rgba(34,22,58,0.12);
      }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; letter-spacing: -0.06em; font-size: clamp(2.7rem, 5vw, 4.8rem); line-height: 0.96; }
      .eyebrow { color: var(--purple-2); letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.72rem; font-weight: 700; }
      .lead { margin-top: 1.2rem; color: var(--ink-soft); line-height: 1.9; font-size: 1.04rem; }
      .contact-box {
        margin-top: 2rem;
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.9rem 1.2rem;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--purple), var(--purple-2));
        color: white;
        font-weight: 600;
      }
      footer { background: #120e1d; color: rgba(242,236,255,0.72); }
      .footer-inner { padding: 1rem 0; text-align: center; font-size: 0.8rem; }
      @media (max-width: 760px) { .nav { display: none; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="AIM-STEP home">
          <span class="brand-badge">A</span>
          <span>AIM-STEP</span>
        </a>
        <nav class="nav" aria-label="Main navigation">
          <a href="index.html">AIM-STEP</a>
          <a href="team.html">Team</a>
          <a href="liu.html">Liu Ming</a>
          <a href="workflow.html">Workflow</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="container">
        <div class="card">
          <p class="eyebrow">Contact</p>
          <h1>Connect with AIM-STEP.</h1>
          <p class="lead">
            For questions, collaboration opportunities, or project discussions, please contact us through the email below.
          </p>
          <a class="contact-box" href="mailto:liu.ming@ntu.edu.sg">liu.ming@ntu.edu.sg →</a>
        </div>
      </div>
    </main>

    <footer>
      <div class="container footer-inner">© 2026 AIM-STEP</div>
    </footer>
  </body>
</html>
